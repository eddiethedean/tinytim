name: Release to PyPI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Run checks
        uses: ./.github/actions/checks
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate release tag
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          package_init = Path("src/tinytim/__init__.py").read_text()
          source_version = re.search(
              r"^__version__\s*=\s*['\"]([^'\"]+)['\"]\s*$",
              package_init,
              re.MULTILINE,
          )
          if source_version is None:
              raise SystemExit("Could not find __version__ in src/tinytim/__init__.py")
          if source_version.group(1) != version:
              raise SystemExit(
                  f"Package version {source_version.group(1)!r} does not match pyproject version {version!r}"
              )
          if not re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", tag):
              raise SystemExit(f"Release tag {tag!r} must use the vX.Y.Z format")
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          PY

  build:
    name: Build distributions
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build source and wheel distributions
        shell: bash
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinytim
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
